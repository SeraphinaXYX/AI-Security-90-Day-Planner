<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Security 90-Day Planner</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="sidebar-header">
        <h1 class="logo">AI Security<br>90-Day Planner</h1>
      </div>
      <div class="nav-items">
        <button class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="task">Today's Task</button>
        <button class="nav-btn" data-view="calendar">Calendar</button>
        <button class="nav-btn" data-view="review">Weekly Review</button>
        <button class="nav-btn" data-view="notes">Notes</button>
        <button class="nav-btn" data-view="settings">Settings</button>
      </div>
      <div class="sidebar-footer" id="sidebar-footer">Day 1 / 90</div>
    </nav>
    <button id="mobile-menu-btn" aria-label="Menu">☰</button>
    <main id="content"></main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
